# ==============================================================================
# Campus Placement Management System - Application Configuration
# [Unit 3: config.properties usage]
# ==============================================================================

# Database Dialect: sqlite (default) or mysql
db.dialect=sqlite

# SQLite Configuration (Zero-setup default)
db.url=jdbc:sqlite:data/placement.db
db.username=
db.password=

# MySQL Example (uncomment and set db.dialect=mysql to switch without code changes;
# also add mysql-connector-j dependency in pom.xml if using MySQL)
# db.dialect=mysql
# db.url=jdbc:mysql://localhost:3306/campus_placement?useSSL=false&serverTimezone=UTC
# db.username=root
# db.password=your_password

# Auto-initialize schema & seed data if database is empty
db.auto.init=true

# Placement Policy after a student accepts an offer:
#   SINGLE_OFFER  -> Student cannot apply to any more drives once an offer is accepted
#   UPGRADE_1_5X  -> Student can only apply to drives paying >= 1.5x of accepted package
placement.policy=UPGRADE_1_5X

# Application Directories
app.resumes.dir=resumes
app.logs.dir=logs
app.backups.dir=backups

# Application Metadata
app.title=Campus Placement Management System
app.version=1.0.0
